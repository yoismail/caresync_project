name: caresync
version: 1.0.0
config-version: 2
profile: caresync
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  caresync:
    staging:
      +database: NEXORA_STAGING
      # NO +schema line = use profile target schema DIRECTLY
      +materialized: table
    marts:
      +database: NEXORA_PROD
      # NO +schema line = use profile target schema DIRECTLY
      +materialized: table