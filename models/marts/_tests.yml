version: 2
models:
  - name: dim_patients
    columns:
      - name: patient_id
        data_tests:
          - unique
          - not_null

  - name: dim_providers
    columns:
      - name: provider_id
        data_tests:
          - unique
          - not_null

  - name: dim_organizations
    columns:
      - name: organization_id
        data_tests:
          - unique
          - not_null

  - name: dim_payers
    columns:
      - name: payer_id
        data_tests:
          - unique
          - not_null

  - name: fct_appointments
    columns:
      - name: encounter_id
        data_tests:
          - unique
          - not_null
      - name: patient_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patients')
                field: patient_id
      - name: provider_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_providers')
                field: provider_id
      - name: organization_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_organizations')
                field: organization_id
      - name: payer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payers')
                field: payer_id
      - name: encounter_class
        data_tests:
          - accepted_values:
              arguments:
                values: ['ambulatory','inpatient','outpatient','emergency','urgentcare','wellness','other']

  - name: fct_conditions
    columns:
      - name: encounter_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_appointments')
                field: encounter_id
      - name: patient_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patients')
                field: patient_id
